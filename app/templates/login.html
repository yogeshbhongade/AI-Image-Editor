{% extends "base.html" %}
{% block title %}Login - ImageCraft{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" />
{% endblock %}

{% block content %}
<div class="auth-container">
 <div class="auth-card">
 <div class="auth-header">
 <h2>Welcome Back!</h2>
 <p>
                Sign in to your ImageCraft account</p>
 </div>

<form id="login-form" class="auth-form" method="POST">
 <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
 <div class="form-group">
 <label for="email_or_username">Email or Username</label>
 <input type="text" id="email_or_username" name="email_or_username" required class="input">
 </div>

 <div class="form-group">
 <label for="password">Password</label>
 <div class="password-field-wrapper">
 <input type="password" id="password" name="password" required class="input" autocomplete="current-password">
 <button type="button" id="toggle-password" class="password-toggle" title="Show or hide password">
 <i class="fa-solid fa-eye"></i>
 </button>
 </div>
 </div>

 <div class="form-group">
 <label>
 <input type="checkbox" name="remember" value="true"> Remember me
 </label>
 </div>

 <button type="submit" class="btn btn-primary btn-lg w-100">Sign In</button>
 </form>

 <div class="auth-divider">
 <span>OR</span>
 </div>

 <div class="auth-footer">
 <p>Don't have an account? <a href="{{ url_for('auth.register') }}">Sign up here</a></p>
 </div>
 </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
